<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Scan billets</title><style>body{margin:0;background:#0a0a0a;color:#f3f1ec;font:17px/1.6 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}h1{color:#ffd60a;font-size:24px}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:16px}button{background:#ffd60a;color:#111;font-weight:700;border:0}.c{background:#151515;border:1px solid #2b2b2b;border-radius:12px;padding:12px;margin:10px 0}.s{display:flex;gap:8px}.s button{margin:3px 0}.m{color:#a9a59b;font-size:14px}.tk{background:#fff;color:#000;border:2px dashed #000;border-radius:12px;padding:14px;margin:12px 0;text-align:center}.q{display:flex;justify-content:center;margin:8px 0}@media print{body{background:#fff}.no{display:none}}</style><style>video{width:100%;border-radius:12px;background:#000}#res{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;padding:20px;z-index:9}</style></head><body>
<h1>Scan à l’entrée</h1><div id="lg"><input id="k" type="password" placeholder="Clé scanner"><button id="ok">Démarrer la caméra</button></div>
<video id="v" playsinline muted style="display:none"></video><canvas id="cv" style="display:none"></canvas>
<div class="c"><input id="man" placeholder="Saisie manuelle du code"><button id="mb">Vérifier</button></div><div id="res"></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));let K=sessionStorage.k||'',last='',lt=0,busy=0;
async function check(t){if(busy)return;busy=1;let j;try{const r=await fetch('/api/scan',{method:'POST',headers:{'x-key':K,'Content-Type':'application/json'},body:JSON.stringify({token:t})});j=r.status==401?{ok:false,msg:'CLÉ INCORRECTE'}:await r.json()}catch(e){j={ok:false,msg:'RÉSEAU INDISPONIBLE'}}
const d=$('#res');d.style.background=j.ok?'#00a650':'#e10600';d.style.display='flex';d.innerHTML=(j.ok?'✔ ':'✖ ')+E(j.msg)+(j.ok?'<div style="font-size:20px;font-weight:400">'+E(j.type)+'<br>'+E(j.name)+'<br>Passage '+j.scan+'/'+j.max+'</div>':'');navigator.vibrate&&navigator.vibrate(j.ok?80:[200,100,200]);
setTimeout(()=>{d.style.display='none';busy=0},j.ok?1800:2600)}
$('#res').onclick=()=>{$('#res').style.display='none';busy=0};$('#mb').onclick=()=>{K=sessionStorage.k||$('#k').value;check($('#man').value)};
async function start(){K=$('#k').value||K;sessionStorage.k=K;try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),v=$('#v');v.srcObject=s;v.style.display='block';$('#lg').style.display='none';await v.play();loop()}catch(e){alert('Caméra non autorisée. Autorisez-la dans les réglages du navigateur, ou utilisez la saisie manuelle.')}}
function loop(){const v=$('#v'),c=$('#cv');if(v.videoWidth&&!busy){const w=480,h=Math.round(w*v.videoHeight/v.videoWidth);c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(v,0,0,w,h);const q=jsQR(x.getImageData(0,0,w,h).data,w,h);if(q&&q.data&&(q.data!==last||Date.now()-lt>4000)){last=q.data;lt=Date.now();check(q.data)}}requestAnimationFrame(loop)}
$('#ok').onclick=start;if(K)$('#k').value=K;
</script></body></html>
