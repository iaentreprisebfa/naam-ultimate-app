<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin billets</title><style>body{margin:0;background:#0a0a0a;color:#f3f1ec;font:17px/1.6 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}h1{color:#ffd60a;font-size:24px}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:16px}button{background:#ffd60a;color:#111;font-weight:700;border:0}.c{background:#151515;border:1px solid #2b2b2b;border-radius:12px;padding:12px;margin:10px 0}.s{display:flex;gap:8px}.s button{margin:3px 0}.m{color:#a9a59b;font-size:14px}.tk{background:#fff;color:#000;border:2px dashed #000;border-radius:12px;padding:14px;margin:12px 0;text-align:center}.q{display:flex;justify-content:center;margin:8px 0}@media print{body{background:#fff}.no{display:none}}</style></head><body>
<h1>Admin billetterie</h1><div id="lg"><input id="k" type="password" placeholder="Clé admin"><button id="ok">Entrer</button></div>
<div id="app" style="display:none"><div id="st" class="c"></div><select id="f"><option value="proof">À valider (preuve reçue)</option><option value="pending">En attente de paiement</option><option value="paid">Validées</option><option value="rejected">Refusées</option><option value="">Toutes</option></select><div id="l"></div></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),F=n=>n.toLocaleString('fr-FR')+' FCFA';let K=sessionStorage.k||'',D=null;
async function api(m,b){const r=await fetch('/api/admin',{method:m,headers:{'x-key':K,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(r.status==401){sessionStorage.k='';K='';$('#lg').style.display='';$('#app').style.display='none';throw 0}return r.json()}
async function load(){D=await api('GET');$('#lg').style.display='none';$('#app').style.display='';render()}
function render(){const f=$('#f').value,p=D.orders.filter(o=>o.status=='paid');$('#st').innerHTML='Encaissé (validé) : <b>'+F(p.reduce((a,o)=>a+o.total,0))+'</b><br>Billets valides : <b>'+D.validTickets+'</b> · Déjà scannés : <b>'+D.scanned+'</b>';
$('#l').innerHTML=D.orders.filter(o=>!f||o.status==f).map(o=>'<div class="c"><b>'+E(o.ref)+'</b> · '+F(o.total)+'<br>'+E(o.name)+' · '+E(o.phone)+'<br>'+o.qty+' × '+E(['Standard · Samedi 23 janvier','Standard · Dimanche 24 janvier','Pass VIP · 23 et 24 janvier'][o.ticket_type])+'<br><span class="m">'+E(o.operator||'')+' '+E(o.txid||'')+' · '+E(o.status)+' · '+new Date(o.created_at).toLocaleString('fr-FR')+'</span>'+(o.status=='paid'?'':'<div class="s"><button data-a="valid" data-r="'+E(o.ref)+'">Valider</button><button data-a="reject" data-r="'+E(o.ref)+'" style="background:#e10600;color:#fff">Refuser</button></div>')+'</div>').join('')||'<p class="m">Aucune commande.</p>'}
$('#l').onclick=async e=>{const b=e.target.closest('button');if(!b||!confirm((b.dataset.a=='valid'?'Valider ':'Refuser ')+b.dataset.r+' ?\nVérifiez que le paiement est bien reçu sur le compte Orange/Moov.'))return;await api('POST',{ref:b.dataset.r,action:b.dataset.a});load()};
$('#f').onchange=render;$('#ok').onclick=()=>{K=$('#k').value;sessionStorage.k=K;load().catch(()=>alert('Clé incorrecte'))};if(K)load().catch(()=>{});
</script></body></html>
