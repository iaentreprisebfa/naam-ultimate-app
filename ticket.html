<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon billet – NAAM Ultimate Game</title><style>body{margin:0;background:#0a0a0a;color:#f3f1ec;font:17px/1.6 system-ui,sans-serif;padding:16px;max-width:560px;margin:auto}h1{color:#ffd60a;font-size:24px}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;font-size:16px}button{background:#ffd60a;color:#111;font-weight:700;border:0}.c{background:#151515;border:1px solid #2b2b2b;border-radius:12px;padding:12px;margin:10px 0}.s{display:flex;gap:8px}.s button{margin:3px 0}.m{color:#a9a59b;font-size:14px}.tk{background:#fff;color:#000;border:2px dashed #000;border-radius:12px;padding:14px;margin:12px 0;text-align:center}.q{display:flex;justify-content:center;margin:8px 0}@media print{body{background:#fff}.no{display:none}}</style></head><body>
<div class="no"><h1>Mon billet</h1><p class="m">Saisissez la référence de commande et le téléphone utilisé.</p>
<input id="r" placeholder="Référence (CMD-…)"><input id="p" type="tel" placeholder="Téléphone"><button id="go">Voir mon billet</button></div><div id="o"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#r').value=new URLSearchParams(location.search).get('ref')||'';
function lq(){return window.QRCode?Promise.resolve():new Promise(r=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=s.onerror=r;document.head.appendChild(s)})}
$('#go').onclick=async()=>{const o=$('#o');o.innerHTML='…';
try{const r=await fetch('/api/ticket?ref='+encodeURIComponent($('#r').value.trim())+'&phone='+encodeURIComponent($('#p').value));if(!r.ok){o.innerHTML='<p>Commande introuvable. Vérifiez la référence et le téléphone.</p>';return}
const j=await r.json();
if(j.status!=='paid'){o.innerHTML='<div class="c">Commande '+E(j.ref)+' : '+({pending:'en attente de paiement',proof:'preuve reçue, validation en cours',rejected:'refusée, contactez-nous sur WhatsApp'}[j.status]||E(j.status))+'</div>';return}
await lq();o.innerHTML='';j.tickets.forEach(t=>{const d=document.createElement('div');d.className='tk';d.innerHTML='<b style="font-size:20px">NAAM ULTIMATE GAME</b><br>'+E(t.type)+' – '+E(t.name)+'<div class="q"></div><b>'+E(t.code)+'</b><br>Festival NAAM · Terrain Nord Mairie Arrondissement 5 (ex Bogodogo), près du SIAO'+(t.max_scans>1?'<br>Valable les 23 et 24 janvier 2027':'');o.appendChild(d);if(window.QRCode)new QRCode(d.querySelector('.q'),{text:t.token,width:170,height:170})});
const b=document.createElement('button');b.className='no';b.textContent='Télécharger / imprimer en PDF';b.onclick=()=>print();o.appendChild(b)}catch(e){o.innerHTML='<p>Service indisponible.</p>'}};
if($('#r').value)$('#p').focus();
</script></body></html>
